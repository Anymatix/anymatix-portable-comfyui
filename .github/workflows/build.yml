name: Build Portable ComfyUI

on:
  # Removing automatic triggers
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
      - name: Build portable package
        run: |
          python create_portable_comfyui.py --ci
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anymatix-portable-comfyui-macos
          path: |
            anymatix-portable-comfyui-darwin-*.zip.part*
            anymatix-portable-comfyui-darwin-*.zip
            anymatix-portable-comfyui-darwin-*.tar.bz2.part*
            anymatix-portable-comfyui-darwin-*.tar.bz2
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
      - name: Build portable package
        run: |
          python create_portable_comfyui.py --ci
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anymatix-portable-comfyui-windows
          path: |
            anymatix-portable-comfyui-windows-*.zip.part*
            anymatix-portable-comfyui-windows-*.zip
            anymatix-portable-comfyui-windows-*.tar.bz2.part*
            anymatix-portable-comfyui-windows-*.tar.bz2
          if-no-files-found: warn

